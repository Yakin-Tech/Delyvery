services:
  postgres:
    image: postgres:16-alpine
    container_name: delyver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: delyver
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - delyver_postgres_data:/var/lib/postgresql/data

volumes:
  delyver_postgres_data:
